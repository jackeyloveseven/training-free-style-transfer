<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>所有实验结果可视化</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'SF Mono', 'Consolas', monospace; background: #0f1117; color: #e2e8f0; padding: 24px; }
h1 { font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 32px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.card { background: #1e2430; border: 1px solid #2d3748; border-radius: 12px; padding: 20px; }
.card h2 { font-size: 13px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
.chart-wrap { position: relative; height: 320px; }
.full { grid-column: 1 / -1; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 6px 10px; color: #64748b; border-bottom: 1px solid #2d3748; font-weight: 600; }
td { padding: 5px 10px; border-bottom: 1px solid #1a2030; color: #cbd5e1; }
tr:hover td { background: #252e3f; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 9999px; font-size: 10px; font-weight: 700; }
.badge-ours { background: #1a3a5c; color: #60a5fa; }
.badge-baseline { background: #2d1b35; color: #c084fc; }
.badge-ablation { background: #1a3323; color: #4ade80; }
.badge-sweep { background: #3a2a10; color: #fb923c; }
.highlight td { color: #60a5fa; font-weight: 600; }
</style>
</head>

</div>

<div class="chart-wrap"><canvas id="chart_adam"></canvas></div>
</div>

<!-- 散点图 4: Native edit per-sample -->
<div class="card">

</div>

<div class="card">
<h2>FLUX.1-dev vs Klein per style</h2>

</div>

const sorted = [...RECORDS].sort((a,b) => b.csd - a.csd);

    <td>${r.method}</td>
    <td>${r.csd.toFixed(4)}</td>

  tbody.appendChild(tr);
});

// ── helpers ──
function makeScatter(id, datasets, xLabel='CSD ↑', yLabel='CLIP-T ↑', xRange=null, yRange=null) {
  const ctx = document.getElementById(id).getContext('2d');
  new Chart(ctx, {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color:'#94a3b8', font:{size:11}, boxWidth:10 } },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label}: (${ctx.parsed.x.toFixed(3)}, ${ctx.parsed.y.toFixed(3)})`
          }
        }
      },
      scales: {
        x: { title:{display:true,text:xLabel,color:'#64748b'}, ticks:{color:'#64748b'}, grid:{color:'#1e2430'},
             ...(xRange ? {min:xRange[0],max:xRange[1]} : {}) },
        y: { title:{display:true,text:yLabel,color:'#64748b'}, ticks:{color:'#64748b'}, grid:{color:'#1e2430'},
             ...(yRange ? {min:yRange[0],max:yRange[1]} : {}) },
      }
    }
  });
}
